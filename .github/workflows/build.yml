name: Build & Publish

on:
  workflow_dispatch: {}
  # No schedule yet -- rebuilds are manual (click "Run workflow" above, or
  # ask Claude to trigger it). Add a `schedule:` trigger here if/when you
  # want the site to refresh from Coda automatically, e.g.:
  #   schedule:
  #     - cron: "0 12 * * *"   # daily at 12:00 UTC

permissions:
  contents: write

concurrency:
  group: build-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate site from Coda
        env:
          CODA_API_KEY: ${{ secrets.CODA_API_KEY }}
        run: python3 scripts/generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Rebuild site from Coda [skip ci]"
            git push
          fi
